name: lint
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:


jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Install python and pdm
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: '3.13'
          cache: true
      - name: Install deps
        run: pdm install --check -G dev
      - name: Black formatting
        run: pdm run black --check .

  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Install python and pdm
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: '3.13'
          cache: true
      - name: Install deps
        run: pdm install --check -G dev
      - name: Ruff linting
        run: pdm run ruff check

  mypy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Install python and pdm
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: '3.13'
          cache: true
      - name: Install deps
        run: pdm install --check -G dev
      - name: Mypy type checking
        run: pdm run mypy
