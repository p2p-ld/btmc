name: tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    strategy:
      fail-fast: false
      matrix:
        # no windows: storage uses os.pwrite, and libtorrent's windows wheels are bugged
        platform: [ "ubuntu-latest", "macos-latest" ]
        # libtorrent has no wheels for 3.14 and up yet, so the tests that need it are skipped there
        python-version: [ "3.12", "3.13", "3.14", "3.15" ]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install python and pdm
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: true
      # the FUSE tests only need the library, not a mount, so its kernel extension isn't loaded
      - name: Install macFUSE
        if: runner.os == 'macOS'
        run: brew install --cask macfuse
      - name: Install deps
        run: pdm install --check -G tests
      - name: Run tests
        run: |
          pdm run test
