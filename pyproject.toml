[project]
name = "btmc"
dynamic=["version"]
description = "btmc - bittorrent microclient: a super small asyncio bittorrent client"
authors = [
    {name = "sneakers-the-rat", email = "sneakers-the-rat@protonmail.com"},
]
dependencies = [
    "torrent-models>=0.6.0",
    "bencode-rs>=0.1.0",
    "httpx>=0.28.1",
    "anyio>=4.5",
    "platformdirs>=4.3",
    "idna>=3.20",
]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "EUPL-1.2"}
keywords = [
    "bittorrent",
    "torrent",
    "asyncio",
    "wacz",
]
classifiers = [
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed"
]

[project.urls]
repository = "https://github.com/p2p-ld/btmc"


[project.optional-dependencies]
cli = [
    "click>=8.1.8",
    "rich>=14.0.0",
]
fsspec = [
    "fsspec>=2025.3.0",
]
mount = [
    "btmc[fsspec]",
    "mfusepy>=3.1.1",
]

[dependency-groups]
mypy = [
    "btmc[cli,mount]",
]
tests = [
    "btmc[cli,mount]",
    # no wheels for 3.14 and up yet. The tests that need it are skipped without it.
    "libtorrent>=2.0.11; python_version<'3.14'",
    "pytest>=8.3.5",
    "pytest-cov>=6.0.0",
]
dev = [
    "btmc[tests,mypy]",
    "ruff>=0.11.2",
    "black>=25.1.0",
    "mypy>=1.15.0",
    "sphinx-autobuild>=2024.10.3",
]
docs = [
    "btmc[cli,mount]",
    "sphinx>=8.2.3",
    "furo>=2024.8.6",
    "myst-parser>=4.0.1",
    "sphinx-design>=0.6.1",
    "sphinx-click>=6.0.0",
]


[project.scripts]
btmc = "btmc.cli.main:main"

[project.entry-points."fsspec.specs"]
torrent = "btmc.fsspec.filesystem:TorrentFileSystem"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true

[tool.pdm.version]
# versions from tags like "v0.1.2"
fallback_version = "0.0.0"
source = "scm"
tag_filter="v*"
tag_regex = '^v(?:\D*)?(?P<version>([1-9][0-9]*!)?(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))*((a|b|c|rc)(0|[1-9][0-9]*))?(\.post(0|[1-9][0-9]*))?(\.dev(0|[1-9][0-9]*))?$)$'


[tool.pdm.scripts]
test = "pytest"
lint.composite = [
    "ruff check",
    "black . --diff",
    "mypy",
]
format.composite = [
    "black .",
    "ruff check --fix",
]
mypy = "mypy"
docs = "sphinx-autobuild ./docs ./docs/_build/html"

[tool.ruff]
target-version = "py312"
include = ["src/btmc/**/*.py", "tests/**/*.py", "pyproject.toml"]
exclude = []
line-length = 100

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # annotations
    "ANN",
    # no debugger
    "T10",
    ## ----------
    # pydocstyle
    # indentation
    "D207", "D208",
    # whitespace
    "D210", "D211",
    # emptiness
    "D419",
    # snake case function name
    "N802",
]
ignore = [
    "ANN401", "ANN204",
    # explicit strict arg for zip
    "B905",
    # builtin type annotations
    "UP006", "UP035",
    # docstrings for __init__
    "D107",
]

fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"src/btmc/__init__.py" = [
    # Import order matters for top level __init__.py
    "I001"
]
"tests/**/test_*" = ["ANN001", "ANN201", "F841"]
"tests/conftest.py" = ["F403", "E402"]
"tests/fixtures/**/*" = ["F403"]

[tool.black]
target-version = ['py312', 'py313', 'py314', 'py315']
include = "(?:tests|btmc)/.*\\.py$"
line-length = 100

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
packages = ["btmc"]
warn_redundant_casts = true
warn_unused_ignores = false
show_error_context = true
show_column_numbers = true
show_error_code_links = true
allow_redefinition = true
pretty = true
color_output = true

[[tool.mypy.overrides]]
# fsspec and mfusepy have no type annotations
module = ["fsspec.*", "mfusepy"]
ignore_missing_imports = true

[tool.pytest]
addopts = [
    "--cov=btmc",
    "--cov-append",
]

testpaths = ["tests"]
anyio_mode = "auto"
markers = [
  "libtorrent: tests that use libtorrent peers",
]
# leaked resources fail tests. When an unclosed object is garbage collected,
# its ResourceWarning reaches pytest as an unraisable exception
filterwarnings = [
  "error::ResourceWarning",
  "error::pytest.PytestUnraisableExceptionWarning",
]
